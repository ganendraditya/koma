<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koma — Manga Translator</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --border: #334155;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        box-sizing: border-box;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        font-size: 10px;
        background-color: var(--accent);
        color: white;
        padding: 2px 6px;
        border-radius: 9999px;
        font-weight: 600;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }

      .status-row:last-child {
        margin-bottom: 0;
      }

      .status-value {
        color: var(--text-primary);
        font-weight: 500;
      }

      .btn {
        width: 100%;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        background-color: var(--accent);
        color: white;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn:hover {
        background-color: var(--accent-hover);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">
        <span>📖 Koma</span>
        <span class="badge">v0.1.0</span>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span>Status:</span>
        <span class="status-value" id="status-text">Ready</span>
      </div>
      <div class="status-row">
        <span>Target Site:</span>
        <span class="status-value" id="site-text">Checking...</span>
      </div>
    </div>

    <button id="btn-translate" class="btn">Translate Current Page</button>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
